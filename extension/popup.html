<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PhishGuard AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: #0a0f1d;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #06b6d4;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }
    .input-group {
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      margin-bottom: 8px;
    }
    input:focus {
      outline: none;
      border-color: #06b6d4;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #06b6d4;
      border: none;
      border-radius: 6px;
      color: #0a0f1d;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #22d3ee;
    }
    .result-card {
      display: none;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .badge-phishing { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
    .badge-suspicious { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
    .badge-legitimate { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); }
    .score { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .xai-list { font-size: 11px; color: #94a3b8; margin-top: 8px; line-height: 1.4; list-style-type: disc; padding-left: 16px; }
    .loading { display: none; text-align: center; font-size: 11px; color: #94a3b8; padding: 10px 0; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">🛡️ PhishGuard AI</span>
    <div><span class="status-dot"></span> <span style="font-size:10px; color:#94a3b8">Active</span></div>
  </div>

  <div class="input-group">
    <input type="text" id="target-url" placeholder="Fetching active tab URL..." />
    <button id="scan-btn">Scan URL</button>
  </div>

  <div id="loader" class="loading">Analyzing lexical features & ML model...</div>

  <div id="result-box" class="result-card">
    <span id="verdict-tag" class="badge"></span>
    <div id="threat-score" class="score"></div>
    <div id="https-note" style="font-size: 11px; margin-bottom: 6px; color:#cbd5e1;"></div>
    <div style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; margin-top:8px;">Explainable AI Flags:</div>
    <ul id="reasons-list" class="xai-list"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
